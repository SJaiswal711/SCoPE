# ============================================================
# PARAMETER DEFINITION FORMAT
# ============================================================
#
# Every parameter must be defined in the following order:
#
#   name = class speed state prior_type lower_bound upper_bound [prior_mean prior_sigma] proposal_sigma
#
# where:
#
#   name          : Unique parameter name.
#   class         : cosmo | nuis
#   speed         : slow | fast
#   state         : sample | fixed
#
#   For a SAMPLED parameter:
#
#     Flat prior:
#       name = class speed sample flat lower_bound upper_bound proposal_sigma
#
#     Gaussian prior:
#       name = class speed sample gaussian lower_bound upper_bound prior_mean prior_sigma proposal_sigma
#
#     lower_bound / upper_bound : Hard parameter limits imposed by the sampler.
#     prior_mean                : Mean of the Gaussian prior.
#     prior_sigma               : Width (standard deviation) of the Gaussian prior.
#     proposal_sigma            : MCMC proposal width used to generate trial steps.
#
#   For a FIXED parameter:
#
#       name = class speed fixed fixed_value
#
# IMPORTANT:
#   - prior_sigma and proposal_sigma are different quantities.
#   - proposal_sigma controls MCMC efficiency and does NOT define the prior.
#   - prior_sigma defines the statistical Gaussian prior and affects the posterior.
#   - For a flat prior, there is no prior_mean or prior_sigma.
#   - A Gaussian prior together with finite lower/upper bounds is a truncated Gaussian.
#
# Examples:
#
#   Omega_b_h2 = cosmo slow sample flat 0.016 0.030 0.001
#
#   A_planck = nuis fast sample gaussian 0.90 1.10 1.0 0.0025 0.0005
#
#   cib_index = nuis fast fixed -1.3
#
# ============================================================

