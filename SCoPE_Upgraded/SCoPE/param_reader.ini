######## SCoPE Parameter file ########
#
# Science configuration for this run. Contains:
#   - global flags       (USE_SN, SAMPLE_NUISANCE)
#   - paths              (CAMB template, OUTDIR, SN data/cov, cov preload)
#   - likelihood setup   (Likelihood_Path_N, LH_N_nuisance_*)
#   - parameter decls    (name = class speed state ...)
#   - one active PROFILE (1..5; Profile 6 is INVALID, for illustration)
#
# Numeric caps (MAX_PARAMS, MAX_TASKARRAY_SIZE, CHAINS, ...) and
# runtime sampler/emulator defaults (MAX_CHAIN_LENGTH, N_DRAG,
# USE_EMULATOR, ...) live in:
#
#     compile_config.h
#
# Edit that header and  ./compile.sh  to change them. Do NOT add
# those names here — the parser has no branches for them and will
# exit(1) with "[FATAL ERROR] Incomplete declaration for parameter".
#
# CLI overrides (win over ini and over header defaults):
#   -drag / -no-drag, -emu / -no-emu, -print / -no-print,
#   -restart, -train-fallback-only, -o outdir, -load-cov file

# ============================================================
# GLOBAL FLAGS
# ============================================================
USE_SN              = 0
SAMPLE_NUISANCE     = 0

# ============================================================
# RUNTIME TUNING (sampler / emulator / I/O defaults)
# ============================================================
# Moved to compile_config.h, Section 2. If you need to override
# a runtime value for one run without rebuilding, add the key
# below (the parser still recognises e.g. MAX_CHAIN_LENGTH,
# N_DRAG, UPDATE_TIME, USE_EMULATOR, USE_DRAGGING, VERBOSE,
# RESTART, EMULATOR_TYPE, POLY_DEGREE, FALLBACK_THRESHOLD,
# TRAIN_ON_FALLBACK_ONLY, EMU_BIAS_MIN_N, N_RECOVERY,
# MAX_EMU_RESCUES, EMU_BIAS_MAX, FREE_REJECT_DCHI2_MAX,
# FREE_REJECT_RATIO, BEGIN_COV_UPDATE, LOW_STEP_BOUND,
# HIGH_STEP_BOUND, DECREASE_STEP, INCREASE_STEP, BEGIN_DRAGGING,
# RMIN_POINTS, RBREAK, MIN_SIZE_FOR_FREEZE_IN,
# MAX_PREVIOUS_POINTS, INITIAL_DRFACTOR).
#
# For a permanent change, edit compile_config.h.

# ============================================================
# PATHS
# ============================================================
CAMB_HighL_Template = data/cmb/HighLExtrapTemplate_lenspotentialCls.dat
OUTDIR              = output_dir                       # CLI: -o outdir
# LOAD_COV_PATH     = output_dir/covMatrix.txt         # CLI: -load-cov
# SN paths only needed when USE_SN = 1
# SN_Data_Path      = data/sn/Pantheon+SH0ES.dat
# SN_Cov_Path       = data/sn/Pantheon+SH0ES_STAT+SYS.cov

# ============================================================
# LAYER A — CAMB PARAMETER DEFAULTS
# ============================================================
w0       = cosmo slow fixed -1.0
wa       = cosmo slow fixed  0.0
m_nu     = cosmo slow fixed  0.0
N_nu     = cosmo slow fixed  3.046
alpha_s  = cosmo slow fixed  0.0
r        = cosmo slow fixed  0.0
n_t      = cosmo slow fixed  0.0
alpha_t  = cosmo slow fixed  0.0
Y_he     = cosmo slow fixed  0.245
Omega_k  = cosmo slow fixed  0.0

# ============================================================
# COSMOLOGICAL PARAMETERS (sampled — all profiles)
# ============================================================
Omega_m_h2 = cosmo slow sample flat 0.08  0.24  0.005
Omega_b_h2 = cosmo slow sample flat 0.016 0.030 0.001
h          = cosmo slow sample flat 0.60  0.80  0.02
tau        = cosmo slow sample flat 0.01  0.20  0.005
n_s        = cosmo slow sample flat 0.80  1.20  0.02
A_s        = cosmo slow sample flat 2.5   3.2   0.03



