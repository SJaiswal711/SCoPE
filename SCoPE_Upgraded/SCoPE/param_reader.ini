# (This sums two Planck high-ℓ likelihoods → wrong posterior.)


# ============================================================
#  COMBINATION RULES
# ============================================================
#
# VALID combinations (no double-counting):
#   - Planck 2013: CAMspec + Commander_2013 + lowlike
#   - Planck 2015: Plik TTTEEE + Commander_2015 + BFLike_2015
#   - Planck 2018: Plik TTTEEE + Commander_2018 + SimAll
#   - Plik-lite (any release) + Commander + SimAll/BFLike
#
# INVALID combinations (double-count the SAME data — do NOT use):
#   - CAMspec_2013 + Plik_2015/2018  (both encode Planck T/TE/EE)
#   - Plik TTTEEE + Plik TT           (TT is a subset of TTTEEE)
#   - Plik TTTEEE + Plik EE           (EE is a subset of TTTEEE)
#   - Plik-lite TTTEEE + Plik TTTEEE  (Plik-lite is a compressed Plik)
#   - SimAll EE + SimAll BB when SimAll EEBB is also loaded
#
# COMBINATIONS THAT REQUIRE CODE CHANGES:
#   - Adding ACT / SPT to any Planck baseline:
#       ACT/SPT go to l=5000; current pipeline stops at lmax=2600.
#       Requires: lmax_in=5000 in camb_interface.h,
#                 lmax_scalar=5000 in camb_settings.ini,
#                 emulator retraining (l=0..5000).
#   - Adding CMB lensing (.clik_lensing files):
#       Different CLIK API (clik_lensing_init / clik_lensing_compute),
#       needs cl_pp thread-through. Not supported.
#   - Full Plik TTTEEE (47 or 94 nuisances):
#       Requires MAX_TASKARRAY_SIZE ≥ 200 (47-nuis) or ≥ 350 (94-nuis).
#       Both satisfied by the current value of 350 in compile_config.h.
#
# ============================================================

# ############################################################
#                                                            #
#   NOT SUPPORTED by this build (needs code changes):        #
#                                                            #
#   1. ACT/SPT (.clik going to ℓ=5000):                      #
#      Requires lmax_in=5000 in camb_interface.h,            #
#               lmax_scalar=5000 in camb_settings.ini,       #
#               emulator retraining to ℓ=5000.               #
#      Files in your tree:                                   #
#        data/likelihoods/planck_2013/actspt_2013_01.clik/   #
#        (also fails CLIK reference test — needs external    #
#         bandpower data files)                              #
#                                                            #
#   2. CMB lensing (.clik_lensing):                          #
#      Different API (clik_lensing_init/compute).            #
#      Requires cl_pp thread-through from CAMB.              #
#      Files in your tree:                                   #
#        data/likelihoods/planck_2013/lensing_*_ref.clik_lensing
#        data/likelihoods/planck_2015/lensing_ext/*.clik_lensing
#        data/likelihoods/planck_2018/baseline/plc_3.0/lensing/*.clik_lensing
#        data/likelihoods/planck_2018/extended_lensing/*.clik_lensing
#                                                            #
# ############################################################


# ============================================================
# HOW TO SWITCH PROFILE
# ============================================================
# 1. Comment out Profile 1 (Likelihood_Path_1, _2, _3, LH_1..3, all nuisances).
#    Quickest way: prefix each active line with '#' using sed:
#      sed -i '/^Likelihood_Path_[123] /s/^/#/'  param_reader.ini
#      sed -i '/^LH_[123]_nuisance/s/^/#/'       param_reader.ini
# 2. Uncomment the target profile (remove leading '#' from its lines).
# 3. No source edits needed — MAX_TASKARRAY_SIZE is already 350 in
#    compile_config.h (fits all profiles below). If you raise the
#    sampled-parameter count above 350, edit compile_config.h and
#    rebuild: ./compile.sh
# 4. Run  mpirun -np 3 ./nmcmc
# 5. Check the startup table:
#      "Total MCMC dimensions: N"  — expected N for each profile:
#        Profile 1 (2013):         20
#        Profile 2 (2018 full):    53
#        Profile 3 (2018 lite):     7
#        Profile 4 (2015 full):   100
#        Profile 5 (2015 lite):     7
# ============================================================
